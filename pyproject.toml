[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-strength-prediction"
version = "0.2.0"
description = "Reproducible, leakage-aware educational concrete-strength regression example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
]
test = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
concrete-strength = "concrete_strength:main"

[tool.setuptools]
py-modules = ["concrete_strength"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
