name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q concrete_strength.py tests
      - name: Validate clean notebook
        run: >-
          python -c "import json; n=json.load(open('Concrete Strength Prediction.ipynb', encoding='utf-8'));
          assert n['nbformat'] == 4;
          assert all(not c.get('outputs') and c.get('execution_count') is None for c in n['cells'] if c['cell_type']=='code')"
